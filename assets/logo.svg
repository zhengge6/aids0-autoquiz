<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="aids0-autoquiz logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#1b2745"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5071"/>
      <stop offset="55%" stop-color="#e0243f"/>
      <stop offset="100%" stop-color="#a80f27"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad2f4"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#2c3a5c" stroke-width="2"/>
  <g fill="#2c3a5c" opacity="0.5">
    <circle cx="40" cy="40" r="2"/><circle cx="88" cy="38" r="2"/><circle cx="168" cy="38" r="2"/><circle cx="216" cy="40" r="2"/>
  </g>

  <!-- Red ribbon: two crossing loops forming the awareness ribbon -->
  <g transform="translate(128 100)" filter="url(#glow)" fill="none"
     stroke="url(#ribbon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- left loop -->
    <path d="M0,-48 C-30,-48 -46,-20 -30,4 C-20,20 -6,34 0,62"/>
    <!-- right loop -->
    <path d="M0,-48 C30,-48 46,-20 30,4 C20,20 6,34 0,62"/>
    <!-- crossing highlight -->
    <path d="M-14,-6 C-4,10 4,26 0,62" stroke-width="10" opacity="0.85"/>
  </g>

  <!-- code brackets </> -->
  <g fill="none" stroke="url(#code)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 190 L82 202 L98 214"/>
    <path d="M158 190 L174 202 L158 214"/>
    <path d="M138 186 L118 218"/>
  </g>

  <!-- success badge -->
  <g transform="translate(190 190)">
    <circle r="26" fill="#06d6a0"/>
    <path d="M-11 0 L-3 9 L12 -9" fill="none" stroke="#0b1320" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
